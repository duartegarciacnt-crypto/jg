<!doctype html>
<html lang="pt-PT">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>ERP Pequeno Negócio</title>
<style>
  :root{
    --bg:#0e1116; --bg-elev:#161b22; --bg-elev2:#1c232d; --border:#2a323d;
    --text:#e6edf3; --text-dim:#9aa7b4; --text-faint:#6b7785;
    --accent:#4f8cff; --accent-dim:#1f3a66;
    --green:#3fb950; --green-dim:#16331f; --amber:#d29922; --amber-dim:#3a2f10;
    --red:#f85149; --red-dim:#3a1614; --purple:#a371f7;
    --radius:10px; --radius-sm:7px;
    --shadow:0 8px 30px rgba(0,0,0,.45);
    font-synthesis:none;
  }
  *{box-sizing:border-box}
  html,body{height:100%}
  body{
    margin:0; background:var(--bg); color:var(--text);
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
    font-size:14px; line-height:1.5; -webkit-font-smoothing:antialiased;
  }
  .app{display:flex; min-height:100vh}

  /* Sidebar */
  .sidebar{
    width:230px; flex:0 0 230px; background:var(--bg-elev);
    border-right:1px solid var(--border); padding:18px 12px; position:sticky; top:0; height:100vh;
    display:flex; flex-direction:column; gap:4px;
  }
  .brand{display:flex; align-items:center; gap:10px; padding:6px 10px 18px}
  .brand .logo{width:30px;height:30px;border-radius:8px;background:linear-gradient(135deg,var(--accent),var(--purple));display:grid;place-items:center;font-weight:700;color:#fff}
  .brand h1{font-size:15px;margin:0;font-weight:650}
  .brand small{display:block;color:var(--text-faint);font-weight:500;font-size:11px}
  .nav-group{font-size:10.5px;text-transform:uppercase;letter-spacing:.08em;color:var(--text-faint);padding:14px 12px 6px;font-weight:600}
  .nav-item{
    display:flex;align-items:center;gap:10px;padding:8px 12px;border-radius:var(--radius-sm);
    color:var(--text-dim);cursor:pointer;font-weight:500;border:1px solid transparent;user-select:none;
  }
  .nav-item:hover{background:var(--bg-elev2);color:var(--text)}
  .nav-item.active{background:var(--accent-dim);color:var(--text);border-color:#2d4d80}
  .nav-item .ico{width:16px;text-align:center;opacity:.9}
  .nav-spacer{flex:1}
  .nav-foot{padding:10px 12px;color:var(--text-faint);font-size:11px;border-top:1px solid var(--border)}

  /* Main */
  .main{flex:1;min-width:0;display:flex;flex-direction:column}
  .topbar{
    display:flex;align-items:center;gap:14px;padding:18px 28px;border-bottom:1px solid var(--border);
    position:sticky;top:0;background:rgba(14,17,22,.85);backdrop-filter:blur(8px);z-index:5;
  }
  .topbar h2{margin:0;font-size:19px;font-weight:650}
  .topbar .sub{color:var(--text-dim);font-size:12.5px}
  .topbar .grow{flex:1}
  .content{padding:24px 28px;max-width:1200px;width:100%}

  /* Buttons */
  .btn{
    display:inline-flex;align-items:center;gap:7px;border:1px solid var(--border);background:var(--bg-elev2);
    color:var(--text);padding:8px 13px;border-radius:var(--radius-sm);cursor:pointer;font-size:13px;font-weight:550;
    font-family:inherit;
  }
  .btn:hover{border-color:#3a4757;background:#222a35}
  .btn.primary{background:var(--accent);border-color:var(--accent);color:#fff}
  .btn.primary:hover{background:#3d7bf0}
  .btn.danger{color:var(--red);border-color:transparent;background:transparent;padding:6px 9px}
  .btn.danger:hover{background:var(--red-dim)}
  .btn.ghost{background:transparent;border-color:transparent;color:var(--text-dim);padding:6px 9px}
  .btn.ghost:hover{background:var(--bg-elev2);color:var(--text)}
  .btn.sm{padding:5px 10px;font-size:12px}

  /* Tabs */
  .tabs{display:flex;gap:4px;margin-bottom:20px;border-bottom:1px solid var(--border)}
  .tab{padding:9px 14px;cursor:pointer;color:var(--text-dim);font-weight:550;border-bottom:2px solid transparent;margin-bottom:-1px}
  .tab:hover{color:var(--text)}
  .tab.active{color:var(--text);border-bottom-color:var(--accent)}

  /* Cards / stats */
  .grid{display:grid;gap:16px}
  .stats{grid-template-columns:repeat(auto-fit,minmax(180px,1fr))}
  .card{background:var(--bg-elev);border:1px solid var(--border);border-radius:var(--radius);padding:18px}
  .stat .label{color:var(--text-dim);font-size:12px;font-weight:550;text-transform:uppercase;letter-spacing:.04em}
  .stat .val{font-size:26px;font-weight:700;margin-top:6px}
  .stat .meta{color:var(--text-faint);font-size:12px;margin-top:4px}

  /* Table */
  .table-wrap{background:var(--bg-elev);border:1px solid var(--border);border-radius:var(--radius);overflow:hidden}
  .table-scroll{overflow-x:auto}
  table{width:100%;border-collapse:collapse;font-size:13.5px;min-width:540px}
  thead th{
    text-align:left;padding:11px 16px;color:var(--text-dim);font-weight:600;font-size:11.5px;
    text-transform:uppercase;letter-spacing:.04em;border-bottom:1px solid var(--border);white-space:nowrap;background:var(--bg-elev2)
  }
  tbody td{padding:12px 16px;border-bottom:1px solid var(--border);vertical-align:middle}
  tbody tr:last-child td{border-bottom:none}
  tbody tr:hover{background:var(--bg-elev2)}
  td.num,th.num{text-align:right;font-variant-numeric:tabular-nums}
  .row-actions{display:flex;gap:2px;justify-content:flex-end;opacity:.55}
  .row-actions.stack{flex-direction:column;align-items:flex-end;gap:0}
  .row-actions.stack .btn{padding:0 4px;font-size:10px;line-height:1.35;border:none;background:none}
  tr:hover .row-actions{opacity:1}
  .status-filter{display:inline-flex;flex-wrap:wrap;gap:4px 10px;align-items:center}
  .status-filter .fl{font-size:11px;color:var(--text-faint);text-transform:uppercase;letter-spacing:.04em;font-weight:600}
  .chk-inline{display:inline-flex;align-items:center;gap:5px;font-size:12px;color:var(--text-dim);cursor:pointer;white-space:nowrap}
  .chk-inline input{width:auto;margin:0;cursor:pointer}

  .empty{padding:48px 20px;text-align:center;color:var(--text-faint)}
  .empty .big{font-size:34px;margin-bottom:10px;opacity:.6}

  /* Pills */
  .pill{display:inline-flex;align-items:center;gap:5px;padding:3px 9px;border-radius:99px;font-size:11.5px;font-weight:600;white-space:nowrap}
  .pill::before{content:"";width:6px;height:6px;border-radius:50%;background:currentColor}
  .pill.gray{background:var(--bg-elev2);color:var(--text-dim)}
  .pill.blue{background:var(--accent-dim);color:#79a9ff}
  .pill.green{background:var(--green-dim);color:var(--green)}
  .pill.amber{background:var(--amber-dim);color:var(--amber)}
  .pill.red{background:var(--red-dim);color:var(--red)}
  .pill.purple{background:#2a1f45;color:var(--purple)}

  .muted{color:var(--text-dim)}
  .faint{color:var(--text-faint)}
  .mono{font-variant-numeric:tabular-nums}
  .right{text-align:right}
  .nowrap{white-space:nowrap}

  /* Modal */
  .overlay{position:fixed;inset:0;background:rgba(0,0,0,.55);display:grid;place-items:center;z-index:50;padding:24px}
  .modal{background:var(--bg-elev);border:1px solid var(--border);border-radius:14px;box-shadow:var(--shadow);width:100%;max-width:680px;max-height:92vh;display:flex;flex-direction:column;overflow:hidden}
  .modal-head{display:flex;align-items:center;padding:18px 22px;border-bottom:1px solid var(--border)}
  .modal-head h3{margin:0;font-size:16px}
  .modal-body{padding:22px;overflow-y:auto}
  .modal-foot{display:flex;justify-content:flex-end;gap:10px;padding:16px 22px;border-top:1px solid var(--border)}
  .prog{height:7px;background:var(--bg-elev2);border-radius:99px;overflow:hidden;min-width:90px}
  .prog > i{display:block;height:100%;background:var(--green);border-radius:99px;transition:width .2s}

  /* ===== Lançamento — timeline ===== */
  .lt-mono{font-family:var(--mono,ui-monospace,Menlo,Consolas,monospace)}
  /* tarefa partilhada pelos 3 modelos */
  .lt-tasks{display:flex;flex-direction:column}
  .lt-task{display:grid;grid-template-columns:20px 1fr auto;gap:11px;align-items:start;padding:9px 0;border-top:1px solid var(--border)}
  .lt-task:first-child{border-top:none}
  .lt-mk{margin-top:3px;width:15px;height:15px;border-radius:50%;cursor:pointer;flex:0 0 auto}
  .lt-mk.todo{border:2px solid var(--text-faint)}
  .lt-mk.doing{border:2px solid var(--amber);background:radial-gradient(circle,var(--amber) 0 32%,transparent 36%)}
  .lt-mk.done{background:var(--green)}
  .lt-mk.done::after{content:"✓";display:block;text-align:center;font-size:10px;line-height:15px;color:#0b1f12;font-weight:800}
  .lt-tt{font-size:13.5px;font-weight:550}
  .lt-task.done .lt-tt{color:var(--text-dim);text-decoration:line-through;text-decoration-color:var(--text-faint)}
  .lt-st{font-family:var(--mono,monospace);font-size:10.5px;letter-spacing:.06em;color:var(--amber);text-transform:uppercase}
  .lt-why{font-size:12px;color:var(--text-faint);margin-top:1px}
  .lt-task .row-actions{opacity:.5} .lt-task:hover .row-actions{opacity:1}

  /* Modelo 1 — Espinha */
  .lt1 .ph{display:grid;grid-template-columns:42px 1fr;gap:18px}
  .lt1 .rail{position:relative;display:flex;justify-content:center}
  .lt1 .rail::before{content:"";position:absolute;top:2px;bottom:-2px;width:2px;background:var(--border)}
  .lt1 .ph.last .rail::before{display:none}
  .lt1 .node{position:relative;z-index:1;width:30px;height:30px;border-radius:50%;background:var(--bg-elev2);border:1px solid var(--border);color:var(--accent);display:grid;place-items:center;font-weight:700;font-size:13px;box-shadow:0 0 0 4px var(--bg)}
  .lt1 .body{padding-bottom:22px;min-width:0}
  .lt1 .when{font-size:11px;letter-spacing:.12em;text-transform:uppercase;color:var(--accent);font-weight:600}
  .lt1 .pt{font-weight:650;font-size:15.5px;margin:2px 0 2px}
  .lt1 .pd{color:var(--text-dim);font-size:12.5px;margin-bottom:10px}
  .section-label{font-size:11px;text-transform:uppercase;letter-spacing:.06em;color:var(--text-faint);font-weight:600;margin:18px 0 10px;padding-top:6px;border-top:1px solid var(--border)}
  .section-label:first-child{border-top:none;padding-top:0;margin-top:0}

  /* Forms */
  .field{margin-bottom:15px}
  .field label{display:block;font-size:12px;font-weight:600;color:var(--text-dim);margin-bottom:6px}
  .field .hint{font-weight:400;color:var(--text-faint)}
  input,select,textarea{
    width:100%;background:var(--bg);border:1px solid var(--border);color:var(--text);
    padding:9px 11px;border-radius:var(--radius-sm);font-size:13.5px;font-family:inherit;
  }
  input:focus,select:focus,textarea:focus{outline:none;border-color:var(--accent);box-shadow:0 0 0 3px rgba(79,140,255,.15)}
  textarea{resize:vertical;min-height:64px}
  .chk{display:inline-flex;align-items:center;gap:8px;font-size:13px;font-weight:600;color:var(--text-dim);cursor:pointer;margin:4px 0 8px}
  .chk input{width:auto;margin:0;cursor:pointer}
  .chk .hint{font-weight:400}
  .form-row{display:grid;grid-template-columns:1fr 1fr;gap:14px}
  .form-row-3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:14px}

  /* Config table */
  .cfg-table{width:100%;border-collapse:collapse;font-size:13px}
  .cfg-table th{text-align:left;font-size:11px;text-transform:uppercase;letter-spacing:.04em;color:var(--text-faint);font-weight:600;padding:0 10px 8px;border-bottom:1px solid var(--border)}
  .cfg-table td{padding:8px 10px;border-bottom:1px solid var(--border);vertical-align:middle}
  .cfg-table tr:last-child td{border-bottom:none}
  .cfg-table .cfg-name{font-weight:600;color:var(--text-dim);white-space:nowrap}
  .cfg-table .price-row{margin-top:0;justify-content:flex-start}
  .cfg-table col.c-price{width:170px}
  .cfg-table col.c-cost{width:120px}
  /* Editor compacto de orçamento/encomenda */
  .doc-edit .section-label{margin:12px 0 6px;padding-top:5px}
  .doc-edit .field{margin-bottom:9px}
  .doc-edit .field label{margin-bottom:3px;font-size:11.5px}
  .doc-edit input,.doc-edit select,.doc-edit textarea{padding:6px 9px;font-size:12.5px}
  .doc-edit .chk{margin:2px 0 6px;font-size:12px}
  .cfg-table.sm{font-size:12px}
  .cfg-table.sm td{padding:4px 8px}
  .cfg-table.sm input,.cfg-table.sm select{padding:4px 7px;font-size:12px}
  .cfg-table.sm .num-in{width:84px;text-align:right}
  .cfg-table.sm td.cfg-name{font-size:11.5px}

  /* Price breakdown */
  .bd{background:var(--bg-elev2);border:1px solid var(--border);border-radius:var(--radius-sm);padding:12px 14px;margin-top:8px}
  .bd-row{display:flex;justify-content:space-between;padding:3px 0;font-size:13px}
  .bd-row .k{color:var(--text-dim)}
  .bd-row.total{border-top:1px solid var(--border);margin-top:6px;padding-top:8px;font-size:16px;font-weight:700}

  /* Segmented toggle */
  .seg{display:inline-flex;border:1px solid var(--border);border-radius:var(--radius-sm);overflow:hidden}
  .seg button{background:var(--bg);color:var(--text-dim);border:none;border-left:1px solid var(--border);padding:8px 14px;cursor:pointer;font-family:inherit;font-size:13px;font-weight:550}
  .seg button:first-child{border-left:none}
  .seg button.active{background:var(--accent);color:#fff}
  .seg button:not(.active):hover{background:var(--bg-elev2);color:var(--text)}

  .kv-grid{display:grid;grid-template-columns:1fr 1fr;gap:12px 22px;margin-bottom:4px}
  .kv-grid > div{display:flex;flex-direction:column;gap:3px}
  .kv-l{font-size:11px;text-transform:uppercase;letter-spacing:.04em;color:var(--text-faint);font-weight:600}
  .kv-v{font-size:14px}
  .price-row{display:flex;align-items:center;gap:8px;margin-top:6px}
  .price-row input{max-width:120px}
  .photo-grid{display:flex;flex-wrap:wrap;gap:8px;margin-top:4px}
  .photo-grid .thumb{position:relative;width:84px;height:84px;border-radius:8px;overflow:hidden;border:1px solid var(--border)}
  .photo-grid .thumb img{width:100%;height:100%;object-fit:cover;display:block;cursor:zoom-in}
  .photo-grid .thumb .rm{position:absolute;top:2px;right:2px;background:rgba(0,0,0,.6);color:#fff;width:18px;height:18px;border-radius:50%;display:grid;place-items:center;font-size:11px;cursor:pointer}
  /* Anexos (imagens / PDFs) */
  .att-list{display:flex;flex-wrap:wrap;gap:8px;margin-top:6px}
  .att{display:flex;align-items:center;gap:8px;padding:6px 8px;border:1px solid var(--border);border-radius:8px;background:var(--bg-elev2);font-size:12px;max-width:260px}
  .att .att-thumb{width:32px;height:32px;border-radius:5px;object-fit:cover;cursor:zoom-in;flex:none}
  .att .att-ic{width:32px;height:32px;border-radius:5px;display:grid;place-items:center;font-size:16px;background:var(--red-dim);color:var(--red);flex:none}
  .att .att-name{flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;color:var(--text-dim)}
  .att .att-btn{cursor:pointer;color:var(--text-dim);padding:2px 5px;border-radius:5px;flex:none}
  .att .att-btn:hover{color:var(--text);background:var(--bg-elev)}
  .lightbox{position:fixed;inset:0;background:rgba(0,0,0,.92);display:grid;place-items:center;z-index:200}
  .lightbox img{max-width:92vw;max-height:88vh;object-fit:contain;border-radius:6px;box-shadow:0 8px 40px rgba(0,0,0,.6)}
  .lightbox .lb-nav{position:absolute;top:50%;transform:translateY(-50%);width:52px;height:52px;border-radius:50%;background:rgba(255,255,255,.12);color:#fff;display:grid;place-items:center;font-size:30px;line-height:1;cursor:pointer;user-select:none}
  .lightbox .lb-nav:hover{background:rgba(255,255,255,.22)}
  .lightbox .lb-prev{left:20px}
  .lightbox .lb-next{right:20px}
  .lightbox .lb-close{position:absolute;top:18px;right:22px;color:#fff;font-size:22px;cursor:pointer;background:rgba(255,255,255,.12);width:42px;height:42px;border-radius:50%;display:grid;place-items:center}
  .lightbox .lb-close:hover{background:rgba(255,255,255,.22)}
  .lightbox .lb-count{position:absolute;bottom:20px;left:50%;transform:translateX(-50%);color:#fff;font-size:13px;background:rgba(0,0,0,.5);padding:4px 12px;border-radius:99px}
  .toolbar{display:flex;align-items:center;gap:10px;margin-bottom:16px;flex-wrap:wrap}
  .toolbar .grow{flex:1}
  .search{max-width:260px}
  .toast{position:fixed;bottom:22px;left:50%;transform:translateX(-50%);background:var(--bg-elev2);border:1px solid var(--border);padding:11px 18px;border-radius:10px;box-shadow:var(--shadow);z-index:99;font-weight:550}
  a.link{color:var(--accent);text-decoration:none}
  a.link:hover{text-decoration:underline}
  /* Matriz de cobertura de plintos */
  .mtx{border-collapse:separate;border-spacing:5px;width:auto}
  .mtx th{background:transparent;border:none;padding:4px 8px;font-size:11px;color:var(--text-faint);text-align:left}
  .mtx td{border:none;padding:0}
  .mtx tbody tr:hover{background:transparent}
  .mtx-brand{font-weight:650;font-size:12.5px;white-space:nowrap;padding-right:12px!important;color:var(--text);vertical-align:middle}
  .mtx-cell{background:var(--bg-elev2);border:1px solid var(--border);border-radius:8px;padding:7px 10px!important;vertical-align:top;min-width:150px;max-width:230px}
  .mtx-cell.on{background:var(--green-dim);border-color:#2b6b39}
  .mtx-name{font-size:11.5px;font-weight:600;line-height:1.25;color:var(--text)}
  .mtx-cell.on .mtx-name{color:var(--green)}
  .mtx-sub{font-size:9.5px;color:var(--text-dim);margin-top:3px;line-height:1.35;white-space:normal}
  .mtx-empty{background:transparent;border:none;min-width:150px}
  @media(max-width:760px){
    .sidebar{display:none}
    .form-row,.form-row-3{grid-template-columns:1fr}
  }
</style>
</head>
<body>
<div class="app">
  <aside class="sidebar">
    <div class="brand">
      <div class="logo">E</div>
      <div><h1>ERP Pequeno Negócio</h1><small>bases para gira-discos</small></div>
    </div>
    <div class="nav-group">Visão Geral</div>
    <div class="nav-item" data-view="dashboard"><span class="ico">▦</span> Painel</div>
    <div class="nav-group">Vendas</div>
    <div class="nav-item" data-view="quotes"><span class="ico">✎</span> Orçamentos</div>
    <div class="nav-item" data-view="orders"><span class="ico">$</span> Encomendas</div>
    <div class="nav-item" data-view="customers"><span class="ico">☺</span> Clientes</div>
    <div class="nav-item" data-view="prices"><span class="ico">☰</span> Preçário</div>
    <div class="nav-group">Finanças</div>
    <div class="nav-item" data-view="fin-empresa"><span class="ico">⛁</span> Finanças Empresa</div>
    <div class="nav-item" data-view="fin-hobby"><span class="ico">◆</span> Finanças Hobby</div>
    <div class="nav-group">Produto</div>
    <div class="nav-item" data-view="plinths"><span class="ico">↗</span> Plintos</div>
    <div class="nav-item" data-view="accessories"><span class="ico">❖</span> Acessórios</div>
    <div class="nav-spacer"></div>
    <div class="nav-foot">
      <div id="backupBar" style="margin-bottom:8px"></div>
      <div id="dataMeta"></div>
      <div style="margin-top:8px;display:flex;gap:8px">
        <span class="btn ghost sm" id="exportBtn">Exportar</span>
        <span class="btn ghost sm" id="importBtn">Importar</span>
      </div>
    </div>
  </aside>

  <main class="main">
    <div class="topbar">
      <div>
        <h2 id="pageTitle">Painel</h2>
        <div class="sub" id="pageSub"></div>
      </div>
      <div class="grow"></div>
      <div id="pageActions"></div>
    </div>
    <div class="content" id="content"></div>
  </main>
</div>
<div id="modalRoot"></div>
<input type="file" id="fileInput" accept="application/json" style="display:none" />

<script src="erp.js"></script>
</body>
</html>
