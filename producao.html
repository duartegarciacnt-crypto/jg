/* ===== Sessão / autenticação ===== */
function getSession(){ try{return JSON.parse(localStorage.getItem(SKEY)||"null");}catch(e){return null;} }
function setSession(s){ s?localStorage.setItem(SKEY,JSON.stringify(s)):localStorage.removeItem(SKEY); }
async function login(password){
  const r=await fetch(SUPA.url+"/auth/v1/token?grant_type=password",{method:"POST",
    headers:{apikey:SUPA.anon,"Content-Type":"application/json"},
    body:JSON.stringify({email:SUPA.email,password})});
  const j=await r.json();
  if(!r.ok) throw new Error(j.msg||j.error_description||"Password errada");
  setSession({access:j.access_token,refresh:j.refresh_token,exp:Date.now()+(j.expires_in||3600)*1000});
}
async function refresh(){
  const s=getSession(); if(!s||!s.refresh) throw new Error("no session");
  const r=await fetch(SUPA.url+"/auth/v1/token?grant_type=refresh_token",{method:"POST",
    headers:{apikey:SUPA.anon,"Content-Type":"application/json"},body:JSON.stringify({refresh_token:s.refresh})});
  const j=await r.json();
  if(!r.ok){ setSession(null); throw new Error("expired"); }
  setSession({access:j.access_token,refresh:j.refresh_token,exp:Date.now()+(j.expires_in||3600)*1000});
  return j.access_token;
}
async function access(){ const s=getSession(); if(!s) throw new Error("no session"); return (Date.now()>s.exp-60000)?await refresh():s.access; }
async function api(path,opts){
  opts=opts||{}; let tok=await access();
  const go=t=>fetch(SUPA.url+path,{...opts,headers:{apikey:SUPA.anon,Authorization:"Bearer "+t,"Content-Type":"application/json",...(opts.headers||{})}});
  let r=await go(tok); if(r.status===401){ tok=await refresh(); r=await go(tok); } return r;
}
async function getOrders(){
  const r=await api("/rest/v1/orders?select=*"); if(!r.ok) throw new Error("read");
  const list=await r.json();
  const n=x=>parseInt(String(x.number||"").replace(/\D/g,""))||0;
  return list.sort((a,b)=>n(a)-n(b));
}
async function getTasks(){
  const r=await api("/rest/v1/tasks?select=*");

  if(!r.ok) throw new Error(await r.text());
}

/* ===== Datas / prazo ===== */
function pad2(n){ return String(n).padStart(2,"0"); }
function isoOf(d){ return d.getFullYear()+"-"+pad2(d.getMonth()+1)+"-"+pad2(d.getDate()); }
function todayISO(){ return isoOf(new Date()); }
function addDays(iso,n){ const d=new Date(iso+"T00:00:00"); if(isNaN(d)) return null; d.setDate(d.getDate()+n); return d; }
function deadlineISO(o){ const d=o.order_date?addDays(o.order_date,DEADLINE_DAYS):null; return d?isoOf(d):""; }
function daysLeft(o){ const iso=deadlineISO(o); if(!iso) return null; const t=new Date(); t.setHours(0,0,0,0); return Math.round((new Date(iso+"T00:00:00")-t)/86400000); }
function daysText(n){ if(n==null) return "—"; if(n<0) return (-n)+" "+((-n)===1?"dia":"dias")+" em atraso"; if(n===0) return "prazo é hoje"; if(n===1) return "falta 1 dia"; return "faltam "+n+" dias"; }
function daysClass(n){ if(n==null) return ""; if(n<0) return "b-red"; if(n<=3) return "b-amber"; return "b-green"; }
function fmtDate(iso){ const m=/^(\d{4})-(\d{2})-(\d{2})/.exec(iso||""); return m?`${m[3]}/${m[2]}/${m[1]}`:(iso||"—"); }
function fmtWhen(iso){ try{ const d=new Date(iso); return d.toLocaleDateString("pt-PT")+" "+d.toLocaleTimeString("pt-PT",{hour:"2-digit",minute:"2-digit"}); }catch(e){ return ""; } }
const WEEKDAYS=["Domingo","Segunda-feira","Terça-feira","Quarta-feira","Quinta-feira","Sexta-feira","Sábado"];
/* Prazo por extenso: "Quinta-feira 10/07/2026". */
function deadlineLong(o){ const iso=deadlineISO(o); if(!iso) return ""; const d=new Date(iso+"T00:00:00"); if(isNaN(d)) return fmtDate(iso); return WEEKDAYS[d.getDay()]+" "+fmtDate(iso); }

/* Reduz uma imagem para data URL JPEG (mesma abordagem do ERP). */
function photoDataURL(file,maxDim,quality){
  return new Promise((res,rej)=>{
    const fr=new FileReader(); fr.onerror=rej;
    fr.onload=()=>{ const img=new Image(); img.onerror=rej;
      img.onload=()=>{ let w=img.width,h=img.height;
        if(w>=h && w>maxDim){ h=Math.round(h*maxDim/w); w=maxDim; }
        else if(h>maxDim){ w=Math.round(w*maxDim/h); h=maxDim; }
        const c=document.createElement("canvas"); c.width=w; c.height=h;
        c.getContext("2d").drawImage(img,0,0,w,h);
        try{ res(c.toDataURL("image/jpeg",quality)); }catch(e){ rej(e); } };
      img.src=fr.result; };
    fr.readAsDataURL(file);
  });
}

const app=document.getElementById("app");
const esc=s=>String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));

/* Ver uma foto em ecrã cheio (clicar em qualquer sítio fecha). */

let modalOpen=false;
function openModal(title,bodyHTML,footHTML,headExtra){
  const ov=document.createElement("div"); ov.className="ov";
  ov.innerHTML=`<div class="modal"><div class="mhead"><b>${esc(title)}</b>${headExtra||""}<span class="mx">✕</span></div>

  document.body.appendChild(ov); modalOpen=true;
  const close=()=>{ ov.remove(); modalOpen=false; };
  ov.querySelector(".mx").onclick=close;
  ov.addEventListener("click",e=>{ if(e.target===ov) close(); });
  return {ov,close};
}
/* Popup de confirmação (devolve Promise<bool>). */
function confirmDialog(title,html,okLabel){
  return new Promise(res=>{
    const m=openModal(title,html,`<button class="btn ghost" data-no>Cancelar</button><button class="btn primary" data-yes>${esc(okLabel||"Confirmar")}</button>`);
    m.ov.querySelector("[data-no]").onclick=()=>{ m.close(); res(false); };
    m.ov.querySelector("[data-yes]").onclick=()=>{ m.close(); res(true); };
  });
}

/* ===== Menu de secções ===== */

const TABS=[["clients","Encomendas para clientes"],["internal","Encomendas internas"],["tasks","Tarefas"]];
let tab=TABS[0][0];

let pollTimer=null, orderCache=[];
async function renderApp(){

      <header>
        <h1>Produção</h1>
        <button class="btn ghost" id="refresh" title="Atualizar">↻</button>

      </header>
      <nav class="tabs" id="tabs">${TABS.map(([k,l])=>`<button class="tab${k===tab?" on":""}" data-tab="${esc(k)}">${esc(l)}</button>`).join("")}</nav>
    </div>
    <div id="tabview"></div>`;
  document.getElementById("logout").onclick=()=>{ setSession(null); clearInterval(pollTimer); renderLogin(); };
  document.getElementById("refresh").onclick=()=>renderTab();
  app.querySelectorAll("[data-tab]").forEach(b=>b.onclick=()=>{
    if(tab===b.dataset.tab) return;
    tab=b.dataset.tab;
    app.querySelectorAll("[data-tab]").forEach(x=>x.classList.toggle("on",x.dataset.tab===tab));
    renderTab();
  });
  await renderTab();
  clearInterval(pollTimer);
  // Atualiza periodicamente a secção que estiver aberta.
  pollTimer=setInterval(()=>{ if(modalOpen) return;
    if(tab==="tasks"){ if(!taskSaving) loadTasks(true); }   // não recarregar a meio de uma gravação
    else loadOrders(true); }, 25000);
}

/* Desenha a secção escolhida no menu. */
async function renderTab(){
  const view=document.getElementById("tabview"); if(!view) return;
  view.innerHTML=`<div id="list"><div class="empty">A carregar…</div></div>`;
  if(tab==="tasks") await loadTasks(); else await loadOrders();
}

async function loadOrders(silent){
  let orders;
  try{ orders=await getOrders(); }
  catch(e){ if(String(e.message).match(/no session|expired/)){ renderLogin("A sessão expirou. Entra de novo."); return; }
    const box=document.getElementById("list");
    if(!silent && box) box.innerHTML=`<div class="empty">Sem ligação. Tenta ↻ atualizar.</div>`; return; }
  // As encomendas marcadas como "Enviado" saem da lista (ficam concluídas).
  orderCache=orders.filter(o=>o.phase!=="shipped");
  renderOrderList();
}

/* Desenha a lista da secção aberta: clientes ou internas. */
function renderOrderList(){
  const list=document.getElementById("list"); if(!list) return;
  const internal = tab==="internal";
  const rows=orderCache.filter(o=>isInternal(o)===internal);
  // Clientes: por prazo de produção (mais urgente primeiro; sem data vai para o fim).
  // Internas: não têm prazo — mostram-se da mais recente para a mais antiga.
  if(internal) rows.sort((a,b)=>String(b.order_date||"").localeCompare(String(a.order_date||"")));
  else rows.sort((a,b)=>{ const da=deadlineISO(a)||"9999-99-99", dbb=deadlineISO(b)||"9999-99-99"; return da<dbb?-1:da>dbb?1:0; });
  if(!rows.length){
    list.innerHTML=internal
      ? `<div class="empty">Sem encomendas internas.<br>São as peças para stock e os protótipos.</div>`
      : `<div class="empty">Sem encomendas em produção.<br>As novas aparecem aqui; as enviadas saem da lista.</div>`;
    return;
  }
  list.innerHTML=rows.map(cardHTML).join("");
  rows.forEach(wireCard);
}

function cardHTML(o){
  const internal=isInternal(o);
  const dl=internal?null:daysLeft(o);
  const dlISO=internal?"":deadlineISO(o);
  const badge=dl==null?"":`<span class="badge ${daysClass(dl)}">${esc(daysText(dl))}</span>`;
  const flag=(!internal&&o.dest_flag)?` <span class="flag">${esc(o.dest_flag)}</span>`:"";
  const spec=specLine(o);
  // Nas internas o lugar do cliente é ocupado pela etiqueta do tipo (Stock / Protótipo).
  const head=internal
    ? `<span class="tag">${esc(kindLabel(o.internal_kind))}</span>`
    : `<span class="cust">${esc(o.customer||"")}${flag}</span>`;
  return `<div class="card row clickable" data-id="${esc(o.id)}">
    <div class="rmain">
      <div class="top"><span class="num">${esc(o.number||"—")}</span>${head}</div>
      ${o.summary?`<div class="summ">${esc(o.summary)}</div>`:""}
      ${spec?`<div class="plinth">${esc(spec)}</div>`:""}
      ${dlISO?`<div class="dl2">Prazo: ${esc(deadlineLong(o))}</div>`:""}
      ${internal&&o.order_date?`<div class="dl2">Criada em ${esc(fmtDate(o.order_date))}</div>`:""}
    </div>
    <div class="ractions">
      ${badge}
      <span class="pill ${esc(o.phase||"queued")}">${esc(phaseLabel(o.phase))}</span>
    </div>
  </div>`;
}
/* Linha compacta de specs no cartão: madeira · acabamento · espessura. */
function specLine(o){ const s=o.piece_specs||{}; return [s.wood,s.paint,s.thickness].filter(Boolean).join(" · "); }
function wireCard(o){
  const card=app.querySelector(`.card[data-id="${cssEsc(o.id)}"]`); if(!card) return;
  card.onclick=()=>openView(o);      // clicar no cartão abre o modo Ver
}

/* ----- Tarefas: lista de progresso dos modelos e acessórios -----
   Uma caixa por item × tarefa × madeira. Marcar risca a linha; desmarcar repõe.
   Nada desaparece da lista. */
let taskCache=[], taskSaving=0;
async function loadTasks(silent){
  let tasks;
  try{ tasks=await getTasks(); }
  catch(e){ if(String(e.message).match(/no session|expired/)){ renderLogin("A sessão expirou. Entra de novo."); return; }
    const box=document.getElementById("list");
    if(box && String(e.message)==="no table"){
      box.innerHTML=`<div class="empty">Lista ainda não configurada.<br>Falta correr o <b>supabase.sql</b> no Supabase.</div>`; return; }
    if(!silent && box) box.innerHTML=`<div class="empty">Sem ligação. Tenta ↻ atualizar.</div>`; return; }
  taskCache=Array.isArray(tasks)?tasks:[];
  renderTaskList();
}
const GROUPS=[["model","Gira-discos"],["accessory","Acessórios"]];
/* Agrupa as linhas por item, pela ordem definida no Supabase. */
function taskItems(cat){
  const byItem=new Map();
  taskCache.filter(t=>t.category===cat)
    .sort((a,b)=>(a.item_pos-b.item_pos)||(a.pos-b.pos))
    .forEach(t=>{ if(!byItem.has(t.item)) byItem.set(t.item,[]); byItem.get(t.item).push(t); });
  return [...byItem.entries()];
}
function checkRow(t){
  return `<div class="chk${t.done?" on":""}" data-chk="${esc(t.id)}">
    <span class="box">${t.done?"✓":""}</span><span class="chl">${esc(t.task)}</span></div>`;
}
function itemCardHTML(item,rows){
  const done=rows.filter(t=>t.done).length;
  // Tarefas sem madeira primeiro; as restantes agrupadas por madeira, pela ordem original.
  const plain=rows.filter(t=>!t.wood), woods=[];
  rows.filter(t=>t.wood).forEach(t=>{ const g=woods.find(w=>w[0]===t.wood); g?g[1].push(t):woods.push([t.wood,[t]]); });
  return `<div class="card item">
    <div class="ihead"><span class="iname">${esc(item)}</span><span class="iprog${done===rows.length?" full":""}">${done}/${rows.length}</span></div>
    ${plain.map(checkRow).join("")}
    ${woods.map(([w,ts])=>`<div class="wsep">${esc(w)}</div>${ts.map(checkRow).join("")}`).join("")}
  </div>`;
}
function renderTaskList(){
  const list=document.getElementById("list"); if(!list) return;
  if(!taskCache.length){ list.innerHTML=`<div class="empty">Lista vazia.</div>`; return; }
  list.innerHTML=GROUPS.map(([cat,label])=>{
    const items=taskItems(cat); if(!items.length) return "";
    const tot=taskCache.filter(t=>t.category===cat), dn=tot.filter(t=>t.done).length;
    return `<div class="gsec">${esc(label)} <span class="gcount">${dn}/${tot.length}</span></div>`
      + items.map(([item,rows])=>itemCardHTML(item,rows)).join("");
  }).join("");
  list.querySelectorAll("[data-chk]").forEach(el=>el.onclick=()=>toggleTask(el.dataset.chk,el));
}
/* Marca/desmarca já no ecrã e grava a seguir; se falhar, desfaz. */
async function toggleTask(id,el){
  const t=taskCache.find(x=>x.id===id); if(!t||el.dataset.busy) return;
  const done=!t.done, now=new Date().toISOString();
  t.done=done; t.done_at=done?now:null;
  el.classList.toggle("on",done);
  el.querySelector(".box").textContent=done?"✓":"";
  const card=el.closest(".item");
  if(card){ const rows=[...card.querySelectorAll("[data-chk]")];
    const n=rows.filter(r=>r.classList.contains("on")).length;
    const p=card.querySelector(".iprog"); if(p){ p.textContent=n+"/"+rows.length; p.classList.toggle("full",n===rows.length); } }
  el.dataset.busy="1"; taskSaving++;
  try{ await saveTask(id,{done, done_at:done?now:null, updated_at:now, updated_by:"produção"}); }
  catch(e){ t.done=!done; t.done_at=null; toast("Não gravou. Tenta de novo."); renderTaskList(); }
  finally{ taskSaving--; delete el.dataset.busy; }
}

/* ----- Ver (só leitura) ----- */
function openView(o){
  const internal=isInternal(o);
  const dl=internal?null:daysLeft(o);
  const specs=o.piece_specs||{};
  const ref=Array.isArray(o.client_photos)?o.client_photos:[];
  const fin=Array.isArray(o.final_photos)?o.final_photos:[];
  const flag=o.dest_flag?" "+esc(o.dest_flag):"";
  const row=(k,v)=>`<div class="vrow"><span class="vk">${esc(k)}</span><span class="vv">${v}</span></div>`;
  // Fotos indexadas: miniaturas numeradas; clicar abre em ecrã cheio.
  const thumbs=(arr,tag)=>arr.length
    ? `<div class="thumbs vthumbs">${arr.map((s,i)=>`<div class="th"><img src="${s}" data-fs="${tag}:${i}" alt="foto ${i+1}"><span class="thn">${i+1}</span></div>`).join("")}</div>`
    : `<div class="vempty">Sem fotos.</div>`;
  const body=`
    ${internal
      ? `<div class="vsec">Encomenda interna</div>${row("Tipo", esc(kindLabel(o.internal_kind)))}`
      : `<div class="vsec">Cliente</div>${row("Nome", esc(o.customer||"—")+flag)}<div class="vsec">Encomenda</div>`}
    ${row("Modelo", esc(o.summary||"—"))}
    ${row("Madeira", esc(specs.wood||"—"))}
    ${row("Acabamento", esc(specs.paint||"—"))}
    ${row("Espessura", esc(specs.thickness||"—"))}
    ${row("Base", esc(specs.base||"—"))}
    ${row("Estado", `<span class="pill ${esc(o.phase||"queued")}">${esc(phaseLabel(o.phase))}</span>`)}
    ${internal
      ? row("Criada em", esc(fmtDate(o.order_date)))
      : row("Prazo", (deadlineLong(o)||"—")+(dl!=null?` &nbsp;<span class="badge ${daysClass(dl)}">${esc(daysText(dl))}</span>`:""))}
    <div class="vlbl">Comentários</div>
    <div class="vnotes">${o.order_notes?esc(o.order_notes):"—"}</div>
    <div class="vlbl">Fotos da encomenda</div>${thumbs(ref,"ref")}
    <div class="vsec">Produto final</div>
    ${row("Código da peça", esc(o.piece_code||"—"))}
    <div class="vlbl">Fotos do produto final</div>${thumbs(fin,"fin")}
    <div class="vsec">Data e hora da recolha</div>
    ${row("Data", o.pickup_date?fmtDate(o.pickup_date):"—")}
    ${row("Hora", o.pickup_slot?esc(slotLabel(o.pickup_slot)):"—")}
    ${o.updated_by?row("Última alteração", esc(o.updated_by)+(o.updated_at?" · "+esc(fmtWhen(o.updated_at)):"")):""}`;
  const m=openModal((internal?"Interna ":"Encomenda ")+(o.number||""), body,
    `<button class="btn ghost" data-ok>Fechar</button><button class="btn" data-pdf>⬇ PDF</button>`,
    `<button class="btn primary sm" data-toedit>Editar</button>`);
  m.ov.querySelector("[data-ok]").onclick=m.close;
  m.ov.querySelector("[data-pdf]").onclick=()=>pdfOrder(o);
  m.ov.querySelector("[data-toedit]").onclick=()=>{ m.close(); openEdit(o); };
  m.ov.querySelectorAll("[data-fs]").forEach(im=>im.onclick=()=>{
    const p=im.dataset.fs.split(":"); viewPhoto((p[0]==="ref"?ref:fin)[+p[1]]);
  });
}

/* ----- Descarregar PDF da encomenda -----
   MESMO layout/CSS do PDF do ERP (window.docPDF em index.html), mas SEM preços e SEM morada.
   Se alterares o desenho do PDF, altera nos dois sítios (aqui e no ERP). */
function pdfOrder(o){
  const pickup=(o.pickup_date?fmtDate(o.pickup_date):"—")+(o.pickup_slot?" · "+slotLabel(o.pickup_slot):"");
  const detail=[
    ["Estado", phaseLabel(o.phase)],
    ["Código da peça", o.piece_code||"—"],
    ["Data da recolha", o.pickup_date?fmtDate(o.pickup_date):"—"],
    ["Hora da recolha", o.pickup_slot?slotLabel(o.pickup_slot):"—"],
    ["Prazo de produção", deadlineLong(o)||"—"],
    ["Dias restantes", daysText(daysLeft(o))],
  ].map(([k,v])=>`<tr><td>${esc(k)}</td><td>${esc(v)}</td></tr>`).join("");
  const refPhotos=(Array.isArray(o.client_photos)?o.client_photos:[]).map(s=>`<img src="${s}">`).join("");
  const html=`<!doctype html><html lang="pt"><head><meta charset="utf-8"><title>Encomenda ${esc(o.number||"")}</title>
<style>
  *{box-sizing:border-box}
  body{font:13px/1.5 -apple-system,Segoe UI,Roboto,Helvetica,Arial,sans-serif;color:#1a1a1a;margin:0;padding:32px}
  .top{display:flex;justify-content:space-between;align-items:flex-start;border-bottom:2px solid #111;padding-bottom:16px;margin-bottom:20px}
  .biz{font-size:18px;font-weight:700}
  .biz small{display:block;font-size:12px;font-weight:400;color:#666;margin-top:2px}
  .doc-h{text-align:right}
  .doc-h .t{font-size:22px;font-weight:800;letter-spacing:.04em;text-transform:uppercase}
  .doc-h .m{font-size:12px;color:#555;margin-top:4px}
  .cols{display:flex;gap:40px;margin-bottom:22px}
  .cols h4{margin:0 0 6px;font-size:10px;text-transform:uppercase;letter-spacing:.05em;color:#888}
  table{width:100%;border-collapse:collapse;margin-bottom:16px}
  th,td{text-align:left;padding:9px 10px;border-bottom:1px solid #e2e2e2;font-size:13px}
  th{font-size:10px;text-transform:uppercase;letter-spacing:.04em;color:#888;border-bottom:1.5px solid #bbb}
  td.r,th.r{text-align:right;white-space:nowrap}
  .sec{font-size:10px;text-transform:uppercase;letter-spacing:.05em;color:#888;margin:22px 0 8px;font-weight:700}
  .photos{display:flex;flex-wrap:wrap;gap:10px}
  .photos img{width:31%;border-radius:6px;border:1px solid #ddd}
  .foot{margin-top:30px;padding-top:12px;border-top:1px solid #e2e2e2;font-size:11px;color:#999;text-align:center}
  @page{margin:16mm}
  @media print{ body{padding:0} .photos img{page-break-inside:avoid} }
</style></head><body>
  <div class="top">
    <div class="biz">Produção<small>bases para gira-discos</small></div>
    <div class="doc-h"><div class="t">Encomenda</div>
      <div class="m">Nº <b>${esc(o.number||"—")}</b><br>Data: ${esc(fmtDate(o.order_date))}${o.pickup_date?"<br>Recolha: "+esc(pickup):""}</div></div>
  </div>
  <div class="cols">
    <div><h4>Cliente</h4>${esc(o.customer||"—")}</div>
    <div><h4>Recolha</h4>${o.pickup_date?esc(fmtDate(o.pickup_date)):"—"}${o.pickup_slot?"<br>"+esc(slotLabel(o.pickup_slot)):""}</div>
    <div><h4>Modelo mestre</h4><b>${esc(o.summary||"—")}</b>${o.piece_code?"<br>Código: "+esc(o.piece_code):""}</div>

  <table>
    <thead><tr><th>Produção</th><th>Detalhe</th></tr></thead>

  </table>
  ${refPhotos?`<div class="sec">Fotografias da encomenda</div><div class="photos">${refPhotos}</div>`:""}
  <div class="foot">Ficha de produção · gerado em ${esc(fmtDate(todayISO()))} · sem valores</div>
  <script>
    window.addEventListener('load',function(){
      var imgs=[].slice.call(document.images),left=imgs.length;
      function go(){ try{window.focus();window.print();}catch(e){} }
      if(!left) return setTimeout(go,150);
      function done(){ if(--left<=0) setTimeout(go,150); }
      imgs.forEach(function(im){ im.complete?done():(im.onload=im.onerror=done); });
    });

  // iframe escondido: funciona no telemóvel e evita bloqueio de pop-ups.
  const ifr=document.createElement("iframe");

  ifr.style.cssText="position:fixed;right:0;bottom:0;width:1px;height:1px;opacity:0;border:0";
  document.body.appendChild(ifr);
  const d=ifr.contentWindow.document; d.open(); d.write(html); d.close();
  setTimeout(()=>{ try{ ifr.remove(); }catch(e){} }, 60000);   // remove depois do diálogo de impressão

/* ----- Editar (campos que o produtor controla) ----- */
function openEdit(o){
  let phase=o.phase||"queued";
  let slot=o.pickup_slot||"";
  let photos=Array.isArray(o.final_photos)?o.final_photos.slice():[];
  const chips=PHASES.map(([k,l])=>`<span class="phase ${k} ${phase===k?"on":""}" data-phase="${k}">${esc(l)}</span>`).join("");
  const slotBtns=SLOTS.map(([k,l])=>`<span class="slot ${slot===k?"on":""}" data-slot="${k}">${esc(l)}</span>`).join("");
  const body=`
    <div class="lbl">Estado</div>
    <div class="phases" data-phases>${chips}</div>
    <div class="lbl">Código da peça</div>
    <input type="text" data-code value="${esc(o.piece_code||"")}" placeholder="ex.: 010726">
    <div class="lbl">Data da recolha</div>
    <input type="date" data-date value="${esc(o.pickup_date||"")}" min="${todayISO()}">
    <div class="lbl">Hora da recolha</div>
    <div class="slots" data-slots>${slotBtns}</div>
    <div class="lbl">Fotos do produto final</div>
    <div class="thumbs" data-thumbs></div>
    <label class="btn ghost filelbl">＋ Adicionar fotos<input type="file" accept="image/*" multiple data-photoinput style="display:none"></label>`;
  const m=openModal("Editar "+(o.number||"encomenda"),body,
    `<button class="btn ghost" data-cancel>Cancelar</button><button class="btn primary" data-save>Guardar</button>`);
  const ov=m.ov;
  const drawThumbs=()=>{
    const box=ov.querySelector("[data-thumbs]");
    box.innerHTML=photos.length?photos.map((s,i)=>`<div class="th"><img src="${s}" alt="foto ${i+1}"><span class="thx" data-rm="${i}">✕</span></div>`).join("")
      :`<span class="vk" style="font-size:13px">Ainda sem fotos.</span>`;
    box.querySelectorAll(".th img").forEach((im,i)=>im.onclick=()=>viewPhoto(photos[i]));
    box.querySelectorAll("[data-rm]").forEach(b=>b.onclick=()=>{ photos.splice(+b.dataset.rm,1); drawThumbs(); });
  };
  drawThumbs();
  ov.querySelector("[data-photoinput]").onchange=async e=>{
    const files=[...e.target.files]; e.target.value="";
    for(const f of files){ try{ photos.push(await photoDataURL(f,1200,0.7)); }catch(_){} }
    drawThumbs();
  };
  ov.querySelectorAll("[data-phases] .phase").forEach(ch=>ch.onclick=()=>{
    phase=ch.dataset.phase;
    ov.querySelectorAll("[data-phases] .phase").forEach(x=>x.classList.toggle("on",x===ch));
  });
  ov.querySelectorAll("[data-slots] .slot").forEach(b=>b.onclick=()=>{
    slot=(slot===b.dataset.slot)?"":b.dataset.slot;
    ov.querySelectorAll("[data-slots] .slot").forEach(x=>x.classList.toggle("on",x.dataset.slot===slot));
  });
  ov.querySelector("[data-cancel]").onclick=m.close;
  ov.querySelector("[data-save]").onclick=async()=>{
    // Ao marcar "Enviado" pede confirmação — depois de enviado, a encomenda sai desta lista.
    if(phase==="shipped"){
      const ok=await confirmDialog("Marcar como Enviado?",
        `<div class="note">Depois de marcada como <b>Enviado</b>, a encomenda <b>desaparece desta lista</b> (fica concluída). A encomenda continua visível no ERP.</div>`,
        "Sim, marcar Enviado");
      if(!ok) return;
    }
    const btn=ov.querySelector("[data-save]"); btn.disabled=true; btn.textContent="A guardar…";
    try{
      await saveWorkflow(o.id,{
        phase,
        piece_code:ov.querySelector("[data-code]").value.trim()||null,
        pickup_date:ov.querySelector("[data-date]").value||null,
        pickup_slot:slot||null,
        final_photos:photos,
        updated_at:new Date().toISOString(),
        updated_by:"produtor"
      });
      m.close(); toast("Guardado ✓"); loadOrders(true);
    }catch(e){ btn.disabled=false; btn.textContent="Guardar"; toast("Erro ao guardar. Tenta de novo."); }
  };
}

/* arranque */
if(getSession()) renderApp(); else renderLogin();
